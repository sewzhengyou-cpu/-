<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#241934">
<title>姐姐，26岁生日快乐 🎂</title>
<style>
:root{--pink:#ffd3e5;--gold:#ffe6a8;--cream:#fff8f7}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;min-height:100svh;color:var(--cream);background:radial-gradient(circle at 20% 10%,#6d4277 0,transparent 36%),radial-gradient(circle at 90% 80%,#594b91 0,transparent 38%),linear-gradient(135deg,#261732,#211c42 60%,#30213c);font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;overflow-x:hidden}
.bg-stars{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.star{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;opacity:.65;box-shadow:0 0 10px #fff;animation:twinkle 2.5s ease-in-out infinite alternate}
@keyframes twinkle{from{opacity:.15;transform:scale(.5)}to{opacity:.8;transform:scale(1.7)}}
.shell{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:32px 18px 70px}
.top{text-align:center;margin:15px 0 20px;color:#ffdfec;font-size:12px;letter-spacing:.28em;font-weight:700}
.panel{text-align:center;border:1px solid #ffffff38;border-radius:30px;padding:35px 22px 38px;background:linear-gradient(150deg,#ffffff20,#ffffff0a);box-shadow:0 22px 65px #120b2670;backdrop-filter:blur(14px)}
.pill{display:inline-block;padding:7px 15px;border-radius:100px;background:#ffffff17;border:1px solid #ffffff3f;letter-spacing:.13em;font-size:12px}
.age{font-family:Georgia,serif;font-size:clamp(112px,28vw,190px);line-height:1.04;font-weight:700;letter-spacing:-.09em;margin:10px 20px 0 0;background:linear-gradient(155deg,#fff7de 15%,#ffc5d8 52%,#e7baff 95%);color:transparent;background-clip:text;text-shadow:0 12px 55px #ffaec541}
h1{font-size:clamp(25px,5.6vw,43px);line-height:1.4;margin:4px 0 8px}
.subtitle{font-size:15px;line-height:1.85;color:#f9dce9;margin:8px auto 16px;max-width:380px}
.cake{position:relative;width:190px;height:178px;margin:24px auto 10px;filter:drop-shadow(0 13px 17px #150d24aa)}
.plate{position:absolute;bottom:3px;width:195px;height:17px;left:-3px;background:#d5a4cc;border-radius:50%;box-shadow:inset 0 -4px #b279b1}
.layer{position:absolute;bottom:17px;left:16px;width:158px;height:91px;border-radius:18px 18px 25px 25px;background:linear-gradient(#f6a6bc 0 18%,#ffcad2 19% 48%,#d77fa6 49% 57%,#f4b4cc 58%);box-shadow:inset -12px 0 #d783a235}
.icing{position:absolute;bottom:91px;left:15px;width:160px;height:28px;border-radius:55% 55% 26% 26%;background:#fff0ed}
.drip{position:absolute;bottom:78px;width:14px;height:27px;background:#fff0ed;border-radius:0 0 9px 9px}
.d1{left:33px}.d2{left:93px;height:32px;bottom:75px}.d3{left:143px;height:22px;bottom:83px}
.candle{position:absolute;bottom:115px;width:9px;height:44px;background:repeating-linear-gradient(35deg,#fff0dd 0 7px,#df85ac 7px 11px);border-radius:3px}
.c1{left:55px}.c2{left:91px}.c3{left:127px}
.flame{position:absolute;left:-5px;top:-19px;width:19px;height:22px;border-radius:60% 60% 55% 55%;background:radial-gradient(circle at 55% 66%,#fff 0 14%,#ffde79 35%,#ff9866 75%);box-shadow:0 0 17px #ffcf7c;transform-origin:bottom;animation:flicker .55s ease-in-out infinite alternate}
@keyframes flicker{to{transform:rotate(8deg) scale(.87)}}
.blown .flame{animation:out .55s forwards}
@keyframes out{to{opacity:0;transform:translateY(-14px) scale(.1)}}
.btn{appearance:none;border:0;padding:15px 26px;border-radius:999px;background:linear-gradient(110deg,#ffebba,#ffd0df);box-shadow:0 8px 24px #ffb6d440;color:#4e2745;font-size:16px;font-weight:800;cursor:pointer;transition:transform .18s,box-shadow .18s}
.btn:hover{transform:translateY(-3px);box-shadow:0 12px 28px #ffb6d45a}
.btn:active{transform:scale(.97)}
.hint{margin:17px 0 0;font-size:12px;color:#e1bfd2}
.letter{display:none;margin:24px auto 0;text-align:left;max-width:510px;background:#fff9f0;border-radius:24px;padding:26px 25px;color:#6c455d;box-shadow:0 14px 40px #130e2955;animation:appear .7s both}
.letter.open{display:block}
@keyframes appear{from{opacity:0;transform:translateY(24px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
.letter .eyebrow{color:#b16b8e;text-transform:uppercase;letter-spacing:.2em;font-size:11px;font-weight:800}
.letter h2{color:#9b4d73;font-size:24px;margin:10px 0 13px}
.letter p{font-size:15px;line-height:2.05;margin:0 0 11px}
.sign{text-align:right;font-weight:700;color:#b66c91;padding-top:5px}
.footer{text-align:center;color:#dbc0d9;font-size:12px;margin:22px 0}
.confetti{position:fixed;top:-16px;width:9px;height:15px;z-index:10;pointer-events:none;animation:fall var(--duration,4s) linear forwards}
@keyframes fall{to{transform:translate3d(var(--drift,0px),110vh,0) rotate(760deg);opacity:.2}}
@media(max-width:450px){.shell{padding:20px 12px 50px}.panel{padding:28px 13px 30px;border-radius:24px}.subtitle{font-size:14px}.letter{padding:22px 20px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;scroll-behavior:auto!important}}

.memory-photo{max-width:338px;margin:22px auto 24px;padding:10px 10px 4px;background:#fff9f4;border-radius:20px;box-shadow:0 14px 45px #150d2d65;transform:rotate(-1deg)}
.memory-photo img{display:block;width:100%;height:auto;border-radius:13px}
.memory-photo figcaption{font-size:12px;color:#855c71;margin:11px auto 7px}
</style>
</head>
